name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      # On main only: pull requests leave the bundles alone, and they are rebuilt after the merge
      - name: Committed bundles match the sources
        if: github.event_name == 'push'
        run: git diff --exit-code -- energy-sky-card.js energy-sky-card-editor.js
      - run: npm test
      - name: Roboto as the default font, as on Android
        run: |
          sudo apt-get install -y --no-install-recommends fonts-roboto
          mkdir -p ~/.config/fontconfig && cp .github/fontconfig/fonts.conf ~/.config/fontconfig/
          fc-match system-ui
      - name: Browser checks (motion, overflow, sky)
        run: npm run test:browser
