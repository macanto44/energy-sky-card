name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Committed bundles match the sources
        run: git diff --exit-code -- energy-sky-card.js energy-sky-card-editor.js
      - run: npm test
      - name: Browser checks (motion, overflow, sky)
        run: npm run test:browser
