name: Demo

# The live demo on GitHub Pages: demo/live.html on the built card, once a release is out (or by hand).
# It follows the Release workflow rather than the tag: the github-pages environment deploys from main only,
# and a workflow_run runs on main while building the released commit.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The released commit (by hand: main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The site (the bundles beside demo/, as in the repository)
        run: |
          mkdir -p _site
          cp energy-sky-card.js energy-sky-card-editor.js _site/
          cp -r demo _site/demo
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Energy Sky Card, live demo</title>
          <meta http-equiv="refresh" content="0; url=demo/live.html">
          <a href="demo/live.html">Energy Sky Card, live demo</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
