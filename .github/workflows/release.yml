name: Release

# Push a tag vX.Y.Z (matching package.json) to publish a release with the two bundles attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - name: Browser checks (motion, overflow, sky)
        run: npm run test:browser
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" energy-sky-card.js energy-sky-card-editor.js \
            --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
