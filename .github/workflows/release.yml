name: Release

# Push a tag vX.Y.Z (matching package.json) to publish a release with the two bundles attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - name: Roboto as the default font, as on Android
        run: |
          sudo apt-get install -y --no-install-recommends fonts-roboto
          mkdir -p ~/.config/fontconfig && cp .github/fontconfig/fonts.conf ~/.config/fontconfig/
          fc-match system-ui
      - name: Browser checks (motion, overflow, sky)
        run: npm run test:browser
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The note: the version's CHANGELOG section, under a header and the link to the previous release
        run: |
          section=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "## 📦 Stable Release"
            echo
            if [ -n "$previous" ]; then
              echo "_Changes since [$previous]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$previous)_"
              echo
            fi
            if ! grep -q '^### ⚠️ Breaking changes' <<<"$section"; then
              echo "> No breaking change."
            fi
            echo "$section"
            echo
            echo "**Install / update:** search « Energy Sky Card » in the Marketplace / HACS, or download \`energy-sky-card.js\` below."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" energy-sky-card.js energy-sky-card-editor.js \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
