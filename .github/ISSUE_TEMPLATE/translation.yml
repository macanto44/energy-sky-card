name: Translation
description: A word or a sentence that reads wrong in your language, or a new language
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Français, English, Deutsch, Español, Italiano, Nederlands, Another language]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says now, and what it should say
      description: Where it shows (the card, the editor), the current text and your proposal. For a new language, say so; the card's strings live in `src/localize.ts` and the editor's in `src/energy-sky-card-editor.ts`.
    validations:
      required: true
