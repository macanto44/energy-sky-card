<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI only: Roboto as the default sans-serif, as on Android phones, so the
     browser checks measure text the way phones draw it (Ubuntu's default,
     DejaVu Sans, is much wider than Roboto or San Francisco) -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>sans</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
